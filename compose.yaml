services:
  simcc-db:
    image: pgvector/pgvector:pg17
    volumes:
      - simcc-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: [ "${SIMCC_DB_PORT:-5432}" ]
    restart: unless-stopped

  simcc-back:
    image: gleidsoncosta/simcc-back:${SIMCC_BACK_TAG:-latest}
    environment:
      PROXY_URL: http://simcc-back-old:8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@simcc-db:5432/postgres}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://postgres:postgres@simcc-admin-db:5432/postgres}
    env_file: ./.env
    depends_on:
      simcc-db:
        condition: service_healthy
    ports: [ "${SIMCC_BACK_PORT:-8000}:8000" ]
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  simcc-back-old:
    image: gleidsoncosta/simcc-back-old:${SIMCC_BACK_OLD_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@simcc-db:5432/postgres}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://postgres:postgres@simcc-admin-db:5432/postgres}
    env_file: ./.env
    depends_on:
      simcc-db:
        condition: service_healthy
    restart: unless-stopped

  hop:
    image: gleidsoncosta/simcc-extrator:${SIMCC_EXTRATOR_TAG:-latest}
    profiles: [ "extração" ]
    volumes:
      - ./storage/xml:/files/jade-extrator/datasets/lattes_xml
    environment:
      - HOP_LOG_LEVEL=Basic
      - HOP_PROJECT_NAME=Jade-Extrator
      - HOP_PROJECT_FOLDER=/files/jade-extrator
      - HOP_RUN_CONFIG=local
      - HOP_FILE_PATH=$${PROJECT_HOME}/workflows/Index.hwf
      - HOP_RUN_PARAMETERS=DATABASE_URL=jdbc:postgresql://simcc-db:5432/postgres?user=postgres&password=postgres

    depends_on:
      simcc-db:
        condition: service_healthy

volumes:
  simcc-db:

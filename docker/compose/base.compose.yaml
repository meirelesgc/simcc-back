services:
  base_db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  base_hop:
    image: gleidsoncosta/simcc-extrator:latest
    environment:
      HOP_LOG_LEVEL: Basic
      HOP_PROJECT_NAME: Jade-Extrator
      HOP_PROJECT_FOLDER: /files/jade-extrator
      HOP_SERVER_HOSTNAME: 0.0.0.0
      HOP_SERVER_PORT: 8080
      HOP_SERVER_AUTH: false
    command: ["/opt/hop/hop-server.sh"]

  base_api:
    build: ../..
    entrypoint: ./entrypoint.sh